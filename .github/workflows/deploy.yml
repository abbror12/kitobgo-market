name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  # 1. Tekshiruvlar — har push'da
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit

  # 2. Docker image build + GHCR'ga push
  build:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 3. Serverga deploy — SSH orqali yangi image'ni tortib, konteynerni almashtiradi
  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.actor }}
          # Google web client id (backenddagi GOOGLE_OAUTH_CLIENT_ID bilan AYNAN bir xil).
          # Secret qo‘yilmagan bo‘lsa qiymat bo‘sh keladi va sayt Google tugmasini
          # umuman ko‘rsatmaydi — deploy shundan yiqilmaydi.
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          # SSH doim 22-portda (ops/bootstrap.sh uni o'zgartirmaydi). Secret orqali emas,
          # shu yerda aniq yozilgan: SERVER_PORT secret'idagi qiymat oxiridagi \n belgisi
          # drone-ssh'ni "could not parse as int" bilan yiqitgan edi.
          port: 22
          envs: IMAGE,GH_TOKEN,GH_USER,GOOGLE_OAUTH_CLIENT_ID
          script: |
            set -e
            echo "$GH_TOKEN" | docker login ghcr.io -u "$GH_USER" --password-stdin
            docker pull "$IMAGE:latest"
            docker rm -f kitobgo-market 2>/dev/null || true
            docker run -d \
              --name kitobgo-market \
              --restart unless-stopped \
              -p 127.0.0.1:3000:3000 \
              -e KITOBGO_API_URL=https://api.kitobgo.com \
              -e GOOGLE_OAUTH_CLIENT_ID="$GOOGLE_OAUTH_CLIENT_ID" \
              "$IMAGE:latest"
            docker image prune -f
